<div class="ck" id="ck" role="dialog" aria-modal="false" aria-labelledby="ck-title">
  <div class="ck-hd">

    <h2 id="ck-title">Cookies on this site</h2>
  </div>
  <p>We use essential cookies to run the site. With your OK, we also load the Calendly booking calendar and measure our ads and site use. See our <a href="/privacy#cookie-policy" style="color:#0A7A70;text-decoration:underline">Privacy Policy</a>.</p>

    <div class="ck-row">
      <b>Essential</b><span class="ck-always">Always on</span>

    </div>

    <label class="ck-row">
      <b>Ad measurement</b><input type="checkbox" data-cat="ads" checked />

    <label class="ck-row">
      <b>Analytics</b><input type="checkbox" data-cat="analytics" checked />
      <span class="ck-desc">Anonymous counts of which pages get read, so we can improve them.</span>
    </label>
  </div>
  <button type="button" class="ck-btn ck-save" data-ck="save">Save my choices</button>
  <div class="ck-actions">
    <button type="button" class="ck-btn" data-ck="accept">Accept all</button>
    <button type="button" class="ck-btn2" data-ck="essential">Essential only</button>
